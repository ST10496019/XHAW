  <title>Fee Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const courses = {
      "first-aid": 4800,
      "sewing": 4500,
      "landscaping": 5200,
      "life-skills": 4000,
      "cooking": 2200,
      "child-minding": 2500,
      "garden-maintenance": 2100
    };

    function formatR(value){
      return Math.round(value).toLocaleString('en-ZA');
    }

    function calculateTotal() {
      const selected = document.querySelectorAll('input[type=checkbox]:checked') || [];
      let subtotal = 0;
      selected.forEach(c => {
        const v = courses[c.value] || 0;
        subtotal += Number(v);
      });
      let discount = 0;
      if (selected.length === 2) discount = subtotal * 0.05;
      if (selected.length === 3) discount = subtotal * 0.10;
      if (selected.length >= 4) discount = subtotal * 0.15;
      const afterDiscount = subtotal - discount;
      const vat = afterDiscount * 0.15;
      const total = afterDiscount + vat;
      document.getElementById("output").innerHTML =
        `Subtotal: R${formatR(subtotal)}<br>
Discount: R${formatR(discount)}<br>
VAT: R${formatR(vat)}<br>
<strong>Total: R${formatR(total)}</strong>`;
    }
  </script>
</head>
